<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-md rounded-2xl border border-slate-700/80 shadow-2xl p-8 space-y-6">

    <!-- Header Logo & Title -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 text-white shadow-lg shadow-indigo-500/30 mb-2">
        <i class='bx bx-key text-2xl'></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Reset Password</h1>
      <p class="text-xs text-slate-400">Enter your email to receive password reset instructions</p>
    </div>

    <!-- Success Alert -->
    @if (successMessage()) {
      <div class="p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs flex items-center gap-2">
        <i class='bx bx-check-circle text-base shrink-0'></i>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <!-- Error Alert -->
    @if (errorMessage()) {
      <div class="p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
        <i class='bx bx-error-circle text-base shrink-0'></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="forgotEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Email Address</label>
        <div class="relative">
          <input type="email" id="forgotEmail" [(ngModel)]="email" name="email" required placeholder="name@domain.com"
            class="w-full bg-slate-900/80 border border-slate-700 text-white rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
          <i class='bx bx-envelope absolute right-3 top-3 text-slate-400 text-lg pointer-events-none'></i>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-semibold rounded-lg text-sm shadow-lg shadow-indigo-600/30 transition-all flex justify-center items-center gap-2">
        @if (isLoading()) {
          <i class='bx bx-loader-alt animate-spin text-lg'></i> Sending...
        } @else {
          Send Reset Instructions <i class='bx bx-send text-lg'></i>
        }
      </button>
    </form>

    <!-- Footer links -->
    <div class="pt-4 border-t border-slate-700/60 text-center text-xs text-slate-400">
      Remembered your password?
      <a routerLink="/login" class="text-indigo-400 hover:text-indigo-300 font-semibold ml-1">Back to Login</a>
    </div>

  </div>
</div>
